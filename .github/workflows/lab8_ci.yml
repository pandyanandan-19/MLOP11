name: Lab 8 - MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/titanic.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
    paths:
      - "config.yaml"
      - "src/mlops_pipeline/**"
      - "requirements.txt"
      - "data/raw/titanic.csv"
      - ".github/workflows/lab8_ci.yml"
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Titanic Survival MLOps Pipeline
        run: python src/mlops_pipeline/titanic_survival_pipeline.py --force

      - name: Run API and Performance Tests
        run: pytest tests/test_api.py tests/test_performance.py -v

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-ci-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            logs/**
            outputs/**
            models/**
            mlruns/**
          if-no-files-found: ignore
