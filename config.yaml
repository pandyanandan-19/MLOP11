# Labs 7-13: End-to-End Titanic Survival MLOps Pipeline Configuration

data:
  raw_path: data/raw/titanic.csv
  processed_dir: data/processed
  target_column: Survived
  id_column: PassengerId

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 150
  max_depth: 12
  random_state: 42
  class_weight: balanced

mlflow:
  # Leave empty for local MLflow. For GitHub Actions, set the
  # MLFLOW_TRACKING_URI environment variable or put a server URI here.
  tracking_uri: ""
  experiment_name: titanic_survival_model_training_lab7

registry:
  model_name: Titanic_Survival_Production_Model
  decision_metric: recall

quality_gate:
  metric: recall
  minimum_value: 0.70

lab9:
  repetitions: 3

paths:
  preprocessor: models/preprocessor.pkl
  model: models/titanic_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  inference_output: outputs/inference_predictions.csv
